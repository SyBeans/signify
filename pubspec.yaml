name: signify
description: "Offline AI-Based FSL Recognition and Translation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  flutter_tts: ^4.0.2
  camera: ^0.12.1
  permission_handler: ^11.0.1
  face_detection_tflite: ^6.8.0
  hand_landmarker: ^3.1.0
  tflite_flutter: ^0.11.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  #Utilities
  intl: ^0.19.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/